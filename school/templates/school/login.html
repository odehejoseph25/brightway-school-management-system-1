<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brightway sign in</title><style>body{font:15px Arial;background:#f3f6f8;display:grid;place-items:center;min-height:100vh}.box{width:min(410px,92vw);background:white;padding:28px;border-radius:14px}input{width:100%;padding:12px;box-sizing:border-box;margin:6px 0 14px}button{width:100%;background:#15966b;color:white;padding:12px;border:0;border-radius:8px}</style></head><body><main class="box"><h1>Brightway International Schools</h1><p>Administrator and Teacher sign in · New Nyanya</p>{% if error %}<p style="color:#b22">{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}<label>Username</label><input name="username" required autocomplete="username"><label>Password</label><input type="password" name="password" required autocomplete="current-password"><button>Sign in</button></form><p style="font-size:11px;color:#777">Ask the system administrator to create your account.</p></main></body></html>
